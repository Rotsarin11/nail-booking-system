        </defs><rect x="0" y="0" width="1140" height="600" fill="#ffffff"/><text x="570" y="44" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="26" fill="#4f46e5" text-anchor="middle" font-weight="700">แผนภาพบริบท (Context Diagram) ของระบบ</text><text x="570" y="72" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="17" fill="#475569" text-anchor="middle" font-weight="400">ระบบจองคิวและจัดการให้บริการทำเล็บออนไลน์</text><rect x="430" y="250" width="280" height="150" rx="20" ry="20" fill="#eef2ff" stroke="#6366f1" stroke-width="3"/><circle cx="464" cy="284" r="20" fill="#fff" stroke="#6366f1" stroke-width="2.5"/><text x="464" y="291" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="22" fill="#4f46e5" text-anchor="middle" font-weight="700">0</text><text x="582.0" y="320" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">ระบบจองคิวและจัดการ</text><text x="582.0" y="348" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">ให้บริการทำเล็บ</text><text x="582.0" y="376" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="19" fill="#1e293b" text-anchor="middle" font-weight="700">ออนไลน์</text><circle cx="110" cy="247" r="12" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/><line x1="110" y1="259" x2="110" y2="287" stroke="#4f46e5" stroke-width="2.5"/><line x1="92" y1="269" x2="128" y2="269" stroke="#4f46e5" stroke-width="2.5"/><line x1="110" y1="287" x2="95" y2="313" stroke="#4f46e5" stroke-width="2.5"/><line x1="110" y1="287" x2="125" y2="313" stroke="#4f46e5" stroke-width="2.5"/><text x="110" y="333.0" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">ลูกค้า</text><circle cx="1030" cy="247" r="12" fill="#fff" stroke="#4f46e5" stroke-width="2.5"/><line x1="1030" y1="259" x2="1030" y2="287" stroke="#4f46e5" stroke-width="2.5"/><line x1="1012" y1="269" x2="1048" y2="269" stroke="#4f46e5" stroke-width="2.5"/><line x1="1030" y1="287" x2="1015" y2="313" stroke="#4f46e5" stroke-width="2.5"/><line x1="1030" y1="287" x2="1045" y2="313" stroke="#4f46e5" stroke-width="2.5"/><text x="1030" y="333.0" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="15" fill="#1e293b" text-anchor="middle" font-weight="700">ผู้ดูแลร้าน</text><line x1="150" y1="270" x2="430" y2="285" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><text x="285" y="236" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">เลือกบริการ / เลือกช่าง</text><text x="285" y="254" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">ขอดูเวลาว่าง / ยืนยันการจอง</text><line x1="430" y1="360" x2="150" y2="345" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><text x="285" y="392" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="400">เวลาว่าง (slot) / ผลการจอง</text><text x="285" y="410" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="400">แจ้งเตือนผ่าน LINE</text><line x1="990" y1="270" x2="710" y2="285" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><text x="855" y="232" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">จัดการบริการ ช่าง</text><text x="855" y="250" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">ตารางงาน / อัปเดตสถานะ</text><text x="855" y="268" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#475569" text-anchor="middle" font-weight="400">บันทึกผลบริการ</text><line x1="710" y1="360" x2="990" y2="345" stroke="#64748b" stroke-width="2.2" marker-end="url(#arr)"/><text x="855" y="394" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="400">รายการจอง / ตารางคิว</text><text x="855" y="412" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#059669" text-anchor="middle" font-weight="400">รายงานสรุป</text><rect x="360" y="470" width="420" height="70" rx="12" ry="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="5 4"/><text x="570" y="500" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="400">หมายเหตุ: การแจ้งเตือนส่งผ่าน LINE Messaging API (Push/Reply)</text><text x="570" y="520" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13.5" fill="#475569" text-anchor="middle" font-weight="400">ช่างทำเล็บเป็นทรัพยากรที่ผู้ดูแลร้านจัดการ ไม่ได้ล็อกอินเข้าระบบ</text></svg>
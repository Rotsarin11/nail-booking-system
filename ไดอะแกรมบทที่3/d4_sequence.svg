<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1060" viewBox="0 0 1280 1060"><defs>
        <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/></marker>
        <marker id="arrs" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
          <path d="M10,0 L0,5 L10,10 z" fill="#64748b"/></marker>
        </defs><rect x="0" y="0" width="1280" height="1060" fill="#ffffff"/><text x="640" y="42" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="23" fill="#4f46e5" text-anchor="middle" font-weight="700">แผนภาพลำดับ (Sequence Diagram): การจองคิว + การกันจองชนกัน</text><text x="640" y="70" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="15" fill="#475569" text-anchor="middle" font-weight="400">เน้นการใช้ Firestore Transaction เพื่อป้องกัน Double Booking</text><rect x="115" y="100" width="190" height="54" rx="10" ry="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="210" y="124" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">ลูกค้า</text><text x="210" y="144" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="400">(หน้า LIFF)</text><line x1="210" y1="154" x2="210" y2="1010" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="525" y="100" width="190" height="54" rx="10" ry="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="620" y="124" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Backend</text><text x="620" y="144" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="400">(Express + Admin SDK)</text><line x1="620" y1="154" x2="620" y2="1010" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><rect x="935" y="100" width="190" height="54" rx="10" ry="10" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/><text x="1030" y="124" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="16" fill="#1e293b" text-anchor="middle" font-weight="700">Cloud Firestore</text><text x="1030" y="144" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="11.5" fill="#475569" text-anchor="middle" font-weight="400">(bookings ฯลฯ)</text><line x1="1030" y1="154" x2="1030" y2="1010" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 5"/><line x1="210" y1="170" x2="620" y2="170" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="415.0" y="162" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">1. เลือกบริการหลายรายการ + วันที่  (ขอเวลาว่าง)</text><rect x="613" y="170" width="14" height="120" rx="2" ry="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/><line x1="620" y1="205" x2="1030" y2="205" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="825.0" y="197" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">2. query staff / schedule / shopClosures / bookings</text><rect x="1023" y="205" width="14" height="30" rx="2" ry="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/><line x1="1030" y1="250" x2="620" y2="250" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="825.0" y="242" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">ข้อมูลช่าง + คิวที่จองแล้ว</text><polyline points="620,275 675,275 675,301 620,301" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="685" y="295" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400">3. คำนวณ requiredMinutes = รวม(duration+buffer)  แล้วหาช่องว่าง</text><line x1="620" y1="330" x2="210" y2="330" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="415.0" y="322" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="400">4. แสดงเวลาว่าง (slot ทุก 30 นาที)</text><line x1="210" y1="385" x2="620" y2="385" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="415.0" y="377" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">5. ยืนยันการจอง (เลือก slot ที่ต้องการ)</text><rect x="150" y="410" width="970" height="540" rx="8" ry="8" fill="none" stroke="#4f46e5" stroke-width="2"/><path d="M150,410 h110 v26 l-16,16 h-94 z" fill="#4f46e5"/><text x="166" y="432" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="14" fill="#fff" text-anchor="start" font-weight="700">runTransaction</text><text x="1104" y="432" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="12.5" fill="#4f46e5" text-anchor="end" font-weight="400">ครอบทั้งบล็อกด้วย Transaction เพื่อกัน race condition</text><rect x="613" y="395" width="14" height="545" rx="2" ry="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/><line x1="620" y1="455" x2="1030" y2="455" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="825.0" y="447" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#1e293b" text-anchor="middle" font-weight="400">6. tx.get: bookings where staffId==, bookingDate==, status in [pending,confirmed]</text><rect x="1023" y="455" width="14" height="30" rx="2" ry="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/><line x1="1030" y1="500" x2="620" y2="500" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="825.0" y="492" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#475569" text-anchor="middle" font-weight="400">รายการคิวในวันนั้นของช่าง</text><polyline points="620,525 675,525 675,551 620,551" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arr)"/><text x="685" y="545" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="12.5" fill="#475569" text-anchor="start" font-weight="400">ตรวจ overlap ในโค้ด:  startTime &lt; newEnd  AND  endTime &gt; newStart</text><rect x="168" y="595" width="934" height="320" rx="6" ry="6" fill="none" stroke="#94a3b8" stroke-width="1.5"/><path d="M168,595 h70 v22 l-14,14 h-56 z" fill="#94a3b8"/><text x="180" y="613" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#fff" text-anchor="start" font-weight="700">alt</text><text x="258" y="613" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="start" font-weight="700">[ ไม่ชน — slot ว่าง ]</text><line x1="620" y1="640" x2="1030" y2="640" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="825.0" y="632" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="400">7a. tx.set(bookings/{id}) = การจองใหม่</text><rect x="1023" y="640" width="14" height="26" rx="2" ry="2" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.2"/><line x1="620" y1="680" x2="1030" y2="680" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/><text x="825.0" y="672" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="400">7b. tx.set(notifications) = ตั้งเตือนล่วงหน้า 1 วัน</text><line x1="1030" y1="720" x2="620" y2="720" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="825.0" y="712" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="400">COMMIT สำเร็จ (atomic)</text><line x1="620" y1="755" x2="210" y2="755" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="415.0" y="747" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#059669" text-anchor="middle" font-weight="400">จองสำเร็จ — ตอบกลับทันทีด้วย Reply Message</text><line x1="168" y1="780" x2="1102" y2="780" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="6 4"/><text x="180" y="615" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="1" fill="#1e293b" text-anchor="middle" font-weight="400"></text><text x="258" y="800" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#dc2626" text-anchor="start" font-weight="700">[ ชน — มีคนจองตัดหน้า (throw SLOT_TAKEN) ]</text><line x1="1030" y1="840" x2="620" y2="840" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="825.0" y="832" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="400">ROLLBACK — ไม่มีการเขียนข้อมูล</text><line x1="620" y1="880" x2="210" y2="880" stroke="#64748b" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arr)"/><text x="415.0" y="872" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="13" fill="#dc2626" text-anchor="middle" font-weight="400">แจ้ง: คิวเพิ่งถูกจอง กรุณาเลือกเวลาใหม่</text><rect x="150" y="975" width="970" height="66" rx="10" ry="10" fill="#fffbeb" stroke="#fcd34d" stroke-width="1.5"/><text x="635" y="1000" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">ข้อจำกัด Firestore: ใช้ inequality ได้แค่ฟิลด์เดียวต่อคิวรี่ จึงทำเงื่อนไข overlap 2 ฟิลด์ในคิวรี่เดียวไม่ได้</text><text x="635" y="1020" font-family="Sarabun, 'Noto Sans Thai', sans-serif" font-size="12.5" fill="#475569" text-anchor="middle" font-weight="400">ทางแก้: query ด้วย equality (staffId, date, status) แล้วเช็ค overlap ในโค้ด ครอบด้วย Transaction เพื่อกันการกดจองพร้อมกัน</text></svg>